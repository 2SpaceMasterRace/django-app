language: python
dist: noble
python:
  - "3.14"

cache: pip

before_install:
  - unset VIRTUAL_ENV

install:
  - python -m pip install uv
  - uv sync --frozen

script:
  - uv run black --check .
  - uv run flake8 .
  - uv run python djangotutorial/manage.py check
  - uv run coverage run djangotutorial/manage.py test polls
  - uv run coverage report --show-missing
  - COVERALLS_SERVICE_NUMBER="$TRAVIS_BUILD_NUMBER" uv run coveralls --service=travis-pro

deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  region: us-west-2
  app: django-app
  env: django-app-env
  bucket: elasticbeanstalk-us-west-2-793452510245
  bucket_path: travis
  wait_until_deployed: true
  on:
    repo: 2SpaceMasterRace/django-app
    branch: main
